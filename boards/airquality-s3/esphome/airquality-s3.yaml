# airquality-s3 — ESPHome configuration (SPEC 7.2)
# CO2 + VOC + temp/humidity node with SSD1306 OLED header.
# ESP32-S3-WROOM-1 (Wi-Fi/BLE). USB-C native (GPIO19/20) for flashing/log.

esphome:
  name: airquality-s3
  friendly_name: "AirQuality S3"

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG   # USB-C on GPIO19/20
api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# ------------- I2C bus: SDA=GPIO8, SCL=GPIO9 (4.7k pull-ups R1/R2) --------
i2c:
  sda: GPIO8
  scl: GPIO9
  scan: true

sensor:
  # SCD40 CO2 (0x62)
  - platform: scd4x
    co2:
      name: "CO2"
    temperature:
      name: "SCD40 temperature"
    humidity:
      name: "SCD40 humidity"
  # SGP40 VOC (0x59) — VOC index via gas sensor baseline
  - platform: sgp40
    name: "VOC index"
  # SHT40 temp/hum (0x44) — primary climate values
  - platform: sht4x
    temperature:
      name: "Temperature"
    humidity:
      name: "Humidity"

# ------------- Status LED GPIO38, BOOT button GPIO0 ------------------------
light:
  - platform: status_led
    name: "Status"
    pin: GPIO38

binary_sensor:
  - platform: gpio
    name: "BOOT button"
    pin:
      number: GPIO0
      inverted: true

# ------------- Optional SSD1306 OLED on J2 (I2C 0x3C) ----------------------
display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    lambda: |-
      it.print(0, 0, "AirQuality S3");
      it.print(0, 16, "CO2 / VOC / T+H");
