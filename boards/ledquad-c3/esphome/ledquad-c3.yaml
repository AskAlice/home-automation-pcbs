# ledquad-c3 — ESPHome configuration (SPEC 4.3)
# 4-channel 12–24 V PWM LED strip driver (RGBW), ESP32-C3.
# PWM: R=GPIO4, G=GPIO5, B=GPIO6, W=GPIO7. Status LED GPIO10, button GPIO9.

esphome:
  name: ledquad-c3
  friendly_name: "LedQuad C3"

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

logger:
  # UART0 (GPIO21 TX0 / GPIO20 RX0) is on the J3 prog header; log there.
  hardware_uart: UART0

api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# ---------------- 4x PWM outputs (LEDC) -> AO3400A low-side gates --------
output:
  - platform: ledc
    pin: GPIO4
    id: pwm_r
  - platform: ledc
    pin: GPIO5
    id: pwm_g
  - platform: ledc
    pin: GPIO6
    id: pwm_b
  - platform: ledc
    pin: GPIO7
    id: pwm_w

light:
  - platform: rgbw
    name: "LED strip"
    red: pwm_r
    green: pwm_g
    blue: pwm_b
    white: pwm_w

# ---------------- Status LED D2 (GPIO10) ----------------------------------
status_led:
  pin: GPIO10

# ---------------- User button BT2 (GPIO9, BOOT) ---------------------------
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO9
      inverted: true
    name: "Button"
