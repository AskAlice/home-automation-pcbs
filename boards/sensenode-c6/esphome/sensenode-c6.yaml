# sensenode-c6 — ESPHome configuration (SPEC 4.1)
# Environmental multisensor: SHT31 + BH1750 + BMP280 on I2C, AM312 PIR,
# status LED, USB-C native flashing. ESP32-C6 (Wi-Fi 6 + 802.15.4 + BLE5).
# For Matter-over-Thread / Zigbee use esp-matter / esp-zigbee-sdk instead
# (see README "Matter-over-Thread" section).

esphome:
  name: sensenode-c6
  friendly_name: "SenseNode C6"

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf

logger:
  # UART0 (GPIO16 TX0 / GPIO17 RX0) is on the J2 prog header; log there.
  hardware_uart: UART0

api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# ---------------- I2C bus: SDA=GPIO6, SCL=GPIO7 (4.7k pull-ups R1/R2) -----
i2c:
  sda: GPIO6
  scl: GPIO7
  scan: true

sensor:
  - platform: sht3xd
    temperature:
      name: "Temperature"
    humidity:
      name: "Humidity"
    address: 0x44
    update_interval: 30s

  - platform: bh1750
    name: "Illuminance"
    address: 0x23
    update_interval: 30s

  - platform: bmp280
    temperature:
      name: "Temperature (BMP280)"
    pressure:
      name: "Pressure"
    address: 0x77
    update_interval: 30s

# ---------------- AM312 PIR on J1 (OUT -> GPIO4) --------------------------
binary_sensor:
  - platform: gpio
    pin: GPIO4
    name: "Motion"
    device_class: motion

# ---------------- Status LED D2 (GPIO8, active low) -----------------------
output:
  - platform: gpio
    pin:
      number: GPIO8
      inverted: true   # D2 cathode to GPIO8 via 1k -> active low
    id: status_led_out

light:
  - platform: binary
    output: status_led_out
    name: "Status LED"
