# blinddriver-c6 — ESPHome configuration (SPEC 7.3)
# TMC2209 stepper roller-blind controller. ESP32-C6-WROOM-1 (Wi-Fi 6).
# USB-C native flashing (GPIO12/13 on J1 pads; TX0=GPIO16/RX0=GPIO17 spare).
# STEP=GPIO4, DIR=GPIO5, EN=GPIO6 (low=enable), DIAG=GPIO7,
# TMC2209 1-wire UART cfg on GPIO15, end-stop on GPIO18.

esphome:
  name: blinddriver-c6
  friendly_name: "BlindDriver C6"

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf

logger:
api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# ------------- TMC2209 control -------------
# NOTE: ESPHome has no built-in tmc2209 component as of 2025 — use the
# external "tmc2209" component (esphome external component) or drive via
# the plain stepper component below (TMC2209 defaults work: 1/8 microstep,
# StealthChop). UART config on GPIO15 is optional and unused here.
uart:
  id: tmc_uart
  tx_pin: GPIO15
  rx_pin: GPIO15       # 1-wire config: single wire to TMC2209 PDN_UART
  baud_rate: 115200

stepper:
  - platform: stepdir
    id: blind_stepper
    step_pin: GPIO4
    dir_pin: GPIO5
    max_speed: 1000 steps/s
    # ENDSTOP (GPIO18) -> home/open end-stop input below.

cover:
  - platform: time_based
    name: "Roller blind"
    open_action:
      - stepper.set_speed: {id: blind_stepper, speed: 500}
      # drive open: set direction/step count for your blind
    open_duration: 25s
    close_action:
      - stepper.set_speed: {id: blind_stepper, speed: 500}
    close_duration: 25s
    stop_action:
      - stepper.set_speed: {id: blind_stepper, speed: 0}
    has_built_in_endstop: false

# EN pin (GPIO6, low = driver enabled) — expose as a switch.
switch:
  - platform: gpio
    name: "Driver enable"
    pin:
      number: GPIO6
      inverted: true

binary_sensor:
  # DIAG (GPIO7) — driver diagnostic output
  - platform: gpio
    name: "TMC2209 DIAG"
    pin: GPIO7
  # End-stop header J8: 3V3/ENDSTOP/GND, GPIO18 (with pull-up)
  - platform: gpio
    name: "End-stop"
    pin:
      number: GPIO18
      inverted: true
    device_class: problem

# Status LED D1 (STAT_LED = GPIO1 via R8 1k)
light:
  - platform: status_led
    name: "Status"
    pin: GPIO1
