# irblaster-c3 — ESPHome configuration (SPEC 7.4)
# IR climate bridge: 2x TSAL6200 TX (S8050 driver, GPIO4), TSOP38238 RX
# (GPIO5), BH1750 lux (I2C). ESP32-C3-WROOM-02. USB-C native flashing.

esphome:
  name: irblaster-c3
  friendly_name: "IRBlaster C3"

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG   # USB-C on GPIO18/19
api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# ------------- IR TX: GPIO4 -> 100R base -> S8050 -> 2x TSAL6200 ----------
remote_transmitter:
  pin: GPIO4
  carrier_duty_percent: 50%

# ------------- IR RX: TSOP38238 on GPIO5 (4.7k pull-up R5, 100nF C4) ------
remote_receiver:
  pin:
    number: GPIO5
    inverted: true
  dump: all

# ------------- I2C: SDA=GPIO6, SCL=GPIO7; BH1750 lux (optional) -----------
i2c:
  sda: GPIO6
  scl: GPIO7
  scan: true

sensor:
  - platform: bh1750
    name: "Illuminance"
    address: 0x23

# ------------- Status LED GPIO10, BOOT button GPIO9 ------------------------
light:
  - platform: status_led
    name: "Status"
    pin: GPIO10

binary_sensor:
  - platform: gpio
    name: "BOOT button"
    pin:
      number: GPIO9
      inverted: true

# ------------- Example: climate_ir (commented — set your model) -----------
# climate:
#   - platform: climate_ir_lg
#     name: "Living room AC"
#     sensor: room_temp   # optional feedback sensor

# Prog header J1: 3V3/TX0=GPIO21/RX0=GPIO20/GND.
