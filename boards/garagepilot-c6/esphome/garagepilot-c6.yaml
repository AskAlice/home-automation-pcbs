# GaragePilot C6 — ESPHome starter configuration
# Wires a garage-door opener's momentary button contacts through the SPDT relay
# and reads door-closed / door-open reed switches plus an optional safety beam.
#
# Board pin assignments:
#   IO4  -> relay driver (active high)
#   IO5  -> INPUT1 (door-closed reed / limit switch)
#   IO6  -> INPUT2 (door-open reed / limit switch)
#   IO7  -> INPUT3 (safety beam / obstruction sensor)
#   IO8  -> status LED (active high)
#   IO9  -> BOOT button (shared with firmware download)
#   IO16/IO17 -> UART0 TX/RX (header J5)
#
esphome:
  name: garagepilot-c6
  friendly_name: GaragePilot C6
  comment: ESP32-C6 garage door controller (v0.1)

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf
    version: recommended

# Logger uses UART0 (IO16 TX, IO17 RX); disable if you need the UART for another device.
logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "GaragePilot-C6 Fallback"
    password: !secret ap_password

captive_portal:

button:
  - platform: restart
    name: "Restart"

binary_sensor:
  # Door-closed position (reed switch to GND, internal pull-up)
  - platform: gpio
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
    name: "Door Closed"
    id: door_closed
    device_class: door
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms

  # Door-open position (reed switch to GND, internal pull-up)
  - platform: gpio
    pin:
      number: GPIO6
      mode: INPUT_PULLUP
      inverted: true
    name: "Door Open"
    id: door_open
    device_class: door
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms

  # Optional safety beam / obstruction sensor (active-low)
  - platform: gpio
    pin:
      number: GPIO7
      mode: INPUT_PULLUP
      inverted: true
    name: "Safety Beam"
    id: safety_beam
    device_class: safety
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms

  # BOOT button (on board)
  - platform: gpio
    pin:
      number: GPIO9
      mode: INPUT_PULLUP
      inverted: true
    name: "Boot Button"
    id: boot_button
    on_press:
      then:
        - cover.toggle: garage_door

switch:
  # Dry relay contact: pulse to actuate the garage-door opener button.
  - platform: gpio
    pin: GPIO4
    name: "Relay Driver"
    id: relay_driver
    internal: true
    restore_mode: ALWAYS_OFF

light:
  # Red status LED
  - platform: status_led
    name: "Status LED"
    pin: GPIO8
    id: status_led_light
    internal: true

# Cover template combines the two limit switches into a garage-door cover.
cover:
  - platform: template
    name: "Garage Door"
    id: garage_door
    device_class: garage
    has_position: false
    optimistic: false
    lambda: |-
      if (id(door_closed).state) {
        return COVER_CLOSED;
      } else if (id(door_open).state) {
        return COVER_OPEN;
      } else {
        return COVER_OPEN;  // unknown/in-motion
      }
    open_action:
      - if:
          condition:
            - binary_sensor.is_off: door_open
            - binary_sensor.is_on: safety_beam  # beam clear
          then:
            - switch.turn_on: relay_driver
            - delay: 250ms
            - switch.turn_off: relay_driver
    close_action:
      - if:
          condition:
            - binary_sensor.is_off: door_closed
            - binary_sensor.is_on: safety_beam  # beam clear
          then:
            - switch.turn_on: relay_driver
            - delay: 250ms
            - switch.turn_off: relay_driver
    stop_action:
      - switch.turn_on: relay_driver
      - delay: 250ms
      - switch.turn_off: relay_driver

sensor:
  - platform: uptime
    name: Uptime
  - platform: wifi_signal
    name: WiFi Signal
    update_interval: 60s

text_sensor:
  - platform: version
    name: ESPHome Version
